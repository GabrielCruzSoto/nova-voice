<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" width="216" height="216">
  <defs>
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2438" />
      <stop offset="55%" stop-color="#101729" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="monogramGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="48%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="monogramBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="starRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="38%" stop-color="#fde68a" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="200" height="200" rx="52" ry="52" fill="url(#squircleBg)" stroke="url(#squircleBorder)" stroke-width="3" />
  <rect x="14" y="14" width="188" height="188" rx="46" ry="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <path d="M 64 156 L 64 60 L 86 60 L 132 126 L 132 60 L 152 60 L 152 156 L 130 156 L 84 90 L 84 156 Z"
        fill="url(#monogramGrad)" stroke="url(#monogramBevel)" stroke-width="1.8" stroke-linejoin="round" />

  <path d="M 69 151 L 69 65 L 84 65 L 131 132 L 131 65 L 147 65"
        fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />

  <g transform="translate(146, 64)" filter="url(#starGlow)">
    <circle cx="0" cy="0" r="24" fill="url(#starRadial)" opacity="0.7" />
    <path d="M 0 -30 Q 2 -6 30 0 Q 2 6 0 30 Q -2 6 -30 0 Q -2 -6 0 -30 Z" fill="#fffbeb" />
    <path d="M 0 -16 Q 1.2 -4 16 0 Q 1.2 4 0 16 Q -1.2 4 -16 0 Q -1.2 -4 0 -16 Z" fill="#fde68a" transform="rotate(45)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>
