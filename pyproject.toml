[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-voice"
version = "0.1.0"
description = "Nova local voice-assisted two-tier agentic orchestrator for Linux"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "commitizen>=4.19.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.18.0",
    "kokoro-onnx>=0.4.0",
    "piper-tts>=1.2.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
version_files = [
    "package.json:version",
    "package-lock.json:version",
    "package-lock.json:packages..version",
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[project.scripts]
nova-desktop = "nova.adapters.desktop_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nova = [
    "py.typed",
    "ui/static/*",
    "extensions/*.ts",
    "plugins/agy_gatekeeper/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".venv/.cache/pytest"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
cache_dir = ".venv/.cache/mypy"
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".venv/.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
