name: PR Quality & Package Checks

on:
  pull_request:
    branches:
      - develop
      - "release/**"
      - master

permissions:
  contents: read

jobs:
  python-quality:
    name: Python Quality & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgirepository1.0-dev python3-gi gir1.2-gtk-3.0

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        timeout-minutes: 3
        run: ruff check src tests

      - name: Type check with Mypy
        timeout-minutes: 5
        run: mypy --strict src tests

      - name: Run Python tests
        timeout-minutes: 10
        run: pytest -q

  ui-quality:
    name: UI Typecheck & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Typecheck TypeScript
        timeout-minutes: 3
        run: npm run typecheck

      - name: Run UI tests
        timeout-minutes: 5
        run: npm run test:ui

      - name: Build UI bundle
        timeout-minutes: 5
        run: npm run build:ui

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install commitizen
        timeout-minutes: 3
        run: pip install "commitizen>=4.19.0"

      - name: Validate PR commits and title
        timeout-minutes: 5
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bash scripts/check-pr-commits.sh \
            --range "${PR_BASE_SHA}..${PR_HEAD_SHA}" \
            --title "${PR_TITLE}"

  gitflow-policy:
    name: Gitflow Branch Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate Gitflow branch pair
        timeout-minutes: 3
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          bash scripts/check-gitflow-policy.sh \
            --head-ref "${PR_HEAD_REF}" \
            --base-ref "${PR_BASE_REF}"

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Check version consistency across manifests
        timeout-minutes: 3
        run: python3 scripts/check-version-consistency.py

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install packaging tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils xz-utils desktop-file-utils

      - name: Install UI dependencies and build UI
        timeout-minutes: 5
        run: npm ci

      - name: Build Debian package (PR mode)
        timeout-minutes: 10
        run: bash packaging/deb/build.sh --mode pr

      - name: Upload Debian package artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: nova-voice_${{ github.sha }}_amd64.deb
          path: dist/*.deb
          retention-days: 7
