name: Develop Build & Artifacts

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "develop-build"
  cancel-in-progress: true

jobs:
  build-dev-deb:
    name: Build Debian Package (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.2.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install packaging tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv dpkg-dev binutils xz-utils desktop-file-utils

      - name: Install UI dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Derive development version
        id: version
        timeout-minutes: 2
        run: |
          BASE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          DEV_VERSION="${BASE_VERSION}-dev"
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Debian package (dev mode)
        timeout-minutes: 10
        env:
          DEV_VERSION: ${{ steps.version.outputs.dev_version }}
        run: |
          bash packaging/deb/build.sh --mode dev
          (cd dist && sha256sum "nova-voice_${DEV_VERSION}_amd64.deb" > "nova-voice_${DEV_VERSION}_amd64.deb.sha256")

      - name: Upload development Debian package artifacts
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: nova-voice_${{ steps.version.outputs.dev_version }}_amd64.deb
          path: |
            dist/nova-voice_${{ steps.version.outputs.dev_version }}_amd64.deb
            dist/nova-voice_${{ steps.version.outputs.dev_version }}_amd64.deb.sha256
          retention-days: 14
