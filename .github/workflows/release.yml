name: Release Publication

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release:
    name: Release Publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install packaging tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils xz-utils desktop-file-utils

      - name: Evaluate release decision
        id: decision
        timeout-minutes: 5
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          OUTPUT="$(bash scripts/release-decision.sh --version "${VERSION}" --sha "${CURRENT_SHA}")"
          echo "${OUTPUT}"
          DECISION="$(echo "${OUTPUT}" | grep -E '^decision=' | head -n1 | cut -d'=' -f2)"
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"

      - name: Build Debian package (release mode)
        if: steps.decision.outputs.decision == 'release'
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          npm ci
          bash packaging/deb/build.sh --mode release
          (cd dist && sha256sum "nova-voice_${VERSION}_amd64.deb" > "nova-voice_${VERSION}_amd64.deb.sha256")

      - name: Extract release notes
        if: steps.decision.outputs.decision == 'release'
        timeout-minutes: 3
        env:
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          python3 scripts/extract-release-notes.py --version "${VERSION}" --output dist/RELEASE_NOTES.md

      - name: Create tag and GitHub Release
        if: steps.decision.outputs.decision == 'release'
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decision.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          TAG="v${VERSION}"
          gh release create "${TAG}" \
            dist/nova-voice_${VERSION}_amd64.deb \
            dist/nova-voice_${VERSION}_amd64.deb.sha256 \
            --target "${TARGET_SHA}" \
            --title "Nova Voice ${VERSION}" \
            --notes-file dist/RELEASE_NOTES.md
