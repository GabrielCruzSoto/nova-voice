name: Release Publication

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release:
    name: Release Publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01f3c817febcb9  # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils xz-utils desktop-file-utils

      - name: Evaluate release decision
        id: decision
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          OUTPUT="$(bash scripts/release-decision.sh --version "${VERSION}" --sha "${{ github.sha }}")"
          echo "${OUTPUT}"
          DECISION="$(echo "${OUTPUT}" | grep -E '^decision=' | head -n1 | cut -d'=' -f2)"
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"

      - name: Build Debian package (release mode)
        if: steps.decision.outputs.decision == 'release'
        run: |
          npm ci
          bash packaging/deb/build.sh --mode release
          VERSION="${{ steps.decision.outputs.version }}"
          (cd dist && sha256sum "nova-voice_${VERSION}_amd64.deb" > "nova-voice_${VERSION}_amd64.deb.sha256")

      - name: Extract release notes
        if: steps.decision.outputs.decision == 'release'
        run: |
          VERSION="${{ steps.decision.outputs.version }}"
          python3 -c '
          from pathlib import Path
          import re, sys
          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          recording = False
          notes = []
          for line in lines:
              if re.match(rf"^##\s+\[?{re.escape(version)}\]?", line):
                  recording = True
                  continue
              elif recording and re.match(r"^##\s+", line):
                  break
              if recording:
                  notes.append(line)
          Path("dist/RELEASE_NOTES.md").write_text("\n".join(notes).strip() + "\n", encoding="utf-8")
          ' "${VERSION}"

      - name: Create tag and GitHub Release
        if: steps.decision.outputs.decision == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.decision.outputs.version }}"
          TAG="v${VERSION}"
          gh release create "${TAG}" \
            dist/nova-voice_${VERSION}_amd64.deb \
            dist/nova-voice_${VERSION}_amd64.deb.sha256 \
            --target "${{ github.sha }}" \
            --title "Nova Voice ${VERSION}" \
            --notes-file dist/RELEASE_NOTES.md
